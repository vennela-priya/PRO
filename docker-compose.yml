version: "3.9"

services:
  # ── REST API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: braintumor_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./results:/app/results
    environment:
      - CONFIG_PATH=/app/config.yaml
      - CHECKPOINT_DIR=/app/checkpoints
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Gradio UI ─────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: braintumor_ui
    command: python src/ui/gradio_app.py
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
    environment:
      - CONFIG_PATH=/app/config.yaml
      - CHECKPOINT_DIR=/app/checkpoints
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── TensorBoard ───────────────────────────────────────────
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: braintumor_tensorboard
    command: tensorboard --logdir=/runs --host=0.0.0.0 --port=6006
    ports:
      - "6006:6006"
    volumes:
      - ./runs:/runs
    restart: unless-stopped

volumes:
  data:
  checkpoints:
  outputs:
  results:
